<!DOCTYPE html>
<html>
  <head>
    <script>
      var path = window.location.pathname;
      window.location.replace(
        '/' + path.split('/').slice(1, 2).join('/') +
        '/?p=' + path.split('/').slice(2).join('/').replace(/&/g, '~and~') +
        (window.location.search ? '&q=' + window.location.search.slice(1).replace(/&/g, '~and~') : '') +
        window.location.hash
      );
    </script>
  </head>
</html>
